id: A01
group: A
name: Market Structure Detector
version: "1.0"
implementation: deterministic
code_agent_id: A01_STRUCTURE
status: IMPLEMENTED
mandate: "Compares the two most recent 6-candle windows of the 1H series: higher highs and higher lows is bullish, lower highs and lower lows is bearish, otherwise neutral."
inputs: [ohlcv_1h]
outputs:
  - {key: verdict, type: "enum[bullish,bearish,neutral,abstain]"}
  - {key: confidence, type: "float[0,1]"}
  - {key: evidence_refs, type: list}
validation: ["no look-ahead", "closed candles only"]
abstention_rule: "abstain if fewer than 12 1H candles"
evidence_required: [timestamp, input_hash, output_json, timeframes_evaluated]
tests: [api/tests/agents.test.ts]

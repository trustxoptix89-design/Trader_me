id: B09
group: B
name: EMA Trend
version: "1.0"
implementation: deterministic
code_agent_id: B09_EMA_TREND
status: IMPLEMENTED
mandate: "EMA20 above EMA50 with close above EMA50 is bullish, the mirror is bearish, disagreement is neutral."
inputs: [ohlcv_1h]
outputs:
  - {key: verdict, type: "enum[bullish,bearish,neutral,abstain]"}
  - {key: confidence, type: "float[0,1]"}
  - {key: evidence_refs, type: list}
validation: ["no look-ahead", "EMA seeded with SMA"]
abstention_rule: "abstain if fewer candles than EMA50 needs"
evidence_required: [timestamp, input_hash, output_json, timeframes_evaluated]
tests: [api/tests/agents.test.ts]

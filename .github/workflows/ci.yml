name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sarmaye_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_PROBE: "true"
      DATABASE_URL: postgres://postgres:ci@localhost:5432/sarmaye_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (errors only)
        run: |
          npm run lint -- --quiet > lint.txt 2>&1 || {
            echo "::error title=lint-output::$(head -c 3000 lint.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - run: npm run check
      - run: npm test
      - run: npm run build
